name: Course syllabus and roadmap checks

on:
  push:
    branches:
      - feature/course-learning
  workflow_dispatch:

jobs:
  course-path:
    runs-on: ubuntu-latest
    env:
      DEMO_ACCOUNT_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Chat AI frontend syntax
        run: |
          node --check static/js/chat.js
          node --check static/js/study_session_chat.js
          node --check static/js/ai_bubble.js
          node tests/test_study_session_chat.js
          node tests/test_ai_bubble.js
          node --check static/js/study_session_timer.js
          node tests/test_study_session_timer.js
          node --check static/js/chat_format.js
          node tests/test_chat_markdown.js
      - name: Validate parser, routes and schemas
        run: |
          python -m py_compile app.py syllabus_learning.py syllabus_routes.py course_path_learning.py course_path_routes.py course_schedule_sync.py study_schedule_conflicts.py study_session_routes.py study_session_tracking.py study_session_quiz.py study_session_chat_context.py chapter_material_routes.py ai_chapter_suggestions.py chapter_tutor.py chapter_chat_context.py chat_lesson_memory.py chat_output_style.py
          python tests/test_syllabus_step1.py
          python tests/test_course_path_step2.py
          python tests/test_course_schedule_sync.py
          python tests/test_study_session_step631.py
          python tests/test_study_session_tracking.py
          python tests/test_study_session_quiz_step71.py
          python tests/test_schedule_conflicts.py
          python tests/test_chapter_materials_step3.py
          python tests/test_chat_output_style.py
