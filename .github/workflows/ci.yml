name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DEMO_ACCOUNT_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Check iPhone Expo Go SDK 58 manifest compatibility
        run: node tests/test_expo_sdk_compat.js

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Bundle Mobile for iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ci

      - name: Compile Flask backend
        run: python -m py_compile app.py

      - name: Initialize SQLite schema
        run: python -c "import app; app.init_db(); print('DB init OK')"

      - name: Check JavaScript syntax
        run: |
          node --check static/js/quiz.js
          node --check static/js/mockup.js
          node --check static/js/study_plan.js
          node --check static/js/study_timetable_periods.js
          node tests/test_study_timetable_periods.js
          node tests/test_weekly_planner_navigation.js
          node --check static/js/chat.js
          node --check static/js/study_session_chat.js
          node --check static/js/ai_bubble.js
          node tests/test_study_session_chat.js
          node tests/test_ai_bubble.js
          node --check static/js/quiz_preparation.js
          node --check static/js/study_session_timer.js
          node tests/test_study_session_timer.js
          node tests/test_chat_markdown.js
          node --check static/js/document-summary.js
          node --check static/js/auth-password.js
          node --check mobile/src/api.js

      - name: Mobile planner and student login UI regressions
        run: |
          node --check mobile/src/plan-utils.js
          node tests/test_mobile_plan_ui.js

      - name: Password eye toggle tests
        run: node tests/test_auth_password.js

      - name: Document summary Markdown/XSS tests
        run: node tests/test_document_summary_markdown.js

      - name: Course syllabus extraction and per-student review
        run: |
          python -m py_compile app.py syllabus_learning.py syllabus_routes.py
          python tests/test_syllabus_step1.py
      - name: Verified course learning paths
        run: |
          python -m py_compile course_path_learning.py course_path_routes.py
          python tests/test_course_path_step2.py
          python tests/test_course_schedule_sync.py

      - name: Admin recovery and student data preservation
        run: python tests/test_admin_recovery.py

      - name: Admin + Shared Knowledge cross-account tests
        run: python tests/test_admin_shared.py

      - name: Global Web readability coverage
        run: python tests/test_web_readability.py

      - name: Study Plan layout and task action regressions
        run: |
          python tests/test_study_plan_ui.py
          python tests/test_schedule_conflicts.py
          python tests/test_study_session_step631.py
          python tests/test_study_session_tracking.py
          python tests/test_study_session_quiz_step71.py
          python tests/test_study_session_quiz_step7234.py
          python tests/test_delete_subject_session_quiz.py
          python -m py_compile study_session_quiz.py study_session_quiz_runtime.py study_session_quiz_routes.py subject_course_cleanup.py
          python -m py_compile study_session_tracking.py study_session_routes.py study_session_chat_context.py

      - name: Final roles and manual deadline data-integrity audit
        run: python tests/test_final_integrity_audit.py

      - name: Final QA regression tests
        run: python tests/test_final_qa.py

      - name: Smoke test core web pages
        run: |
          python - <<'PY'
          import app as project

          project.init_db()

          conn = project.db()
          user = conn.execute(
              "SELECT id,name FROM users WHERE email=?",
              ("demo@study.local",)
          ).fetchone()
          subject = conn.execute(
              "SELECT id FROM subjects WHERE user_id=? ORDER BY id LIMIT 1",
              (user["id"],)
          ).fetchone()
          conn.close()

          client = project.app.test_client()

          with client.session_transaction() as sess:
              sess["user_id"] = user["id"]
              sess["user_name"] = user["name"]

          paths = [
              "/dashboard",
              "/subjects",
              "/documents",
              "/quiz",
              "/study-plan",
              "/chat",
          ]
          if subject:
              paths.append(f"/subjects/{subject['id']}")

          for path in paths:
              response = client.get(path)
              assert response.status_code == 200, (
                  f"{path} returned {response.status_code}"
              )

          # Personal syllabus phải là fallback thực sự cho cả backbone và Chat context.
          conn = project.db()
          created_at = project.now()
          cursor = conn.execute(
              """
              INSERT INTO subjects(
                  user_id,name,code,description,credits,target_score,progress,created_at
              ) VALUES(?,?,?,?,?,?,?,?)
              """,
              (
                  user["id"],
                  "CI Personal Syllabus",
                  "CI-SYL-001",
                  "CI only",
                  3,
                  8.0,
                  0,
                  created_at
              )
          )
          test_subject_id = cursor.lastrowid
          doc_cursor = conn.execute(
              """
              INSERT INTO documents(
                  user_id,subject_id,original_name,stored_name,extracted_text,created_at
              ) VALUES(?,?,?,?,?,?)
              """,
              (
                  user["id"],
                  test_subject_id,
                  "ci_syllabus.txt",
                  "ci_syllabus.txt",
                  "Chương 1: Nền tảng CI. Chương 2: Kiểm thử tích hợp.",
                  created_at
              )
          )
          doc_id = doc_cursor.lastrowid
          conn.execute(
              """
              UPDATE subjects
              SET personal_syllabus_document_id=?
              WHERE id=? AND user_id=?
              """,
              (doc_id, test_subject_id, user["id"])
          )
          conn.commit()

          backbone = project.get_course_learning_backbone(
              conn,
              user["id"],
              test_subject_id
          )
          assert backbone["syllabus_source"] == "personal"
          assert "Nền tảng CI" in backbone["syllabus_text"]
          conn.close()

          chat_context, chat_sources = project.get_shared_subject_context(
              user["id"],
              test_subject_id
          )
          assert "ĐỀ CƯƠNG CÁ NHÂN FALLBACK" in chat_context
          assert "ci_syllabus.txt" in chat_sources

          # Tạo lại AI Plan phải thay deadline đang mở của cùng môn.
          from datetime import datetime, timedelta
          project.build_study_plan = lambda **kwargs: [{
              "date": (datetime.now() + timedelta(days=1)).date().isoformat(),
              "time": "19:00",
              "title": "CI study task",
              "duration": 45,
              "note": "CI"
          }]

          deadline_1 = (
              datetime.now() + timedelta(days=7)
          ).replace(hour=23, minute=0, second=0, microsecond=0)
          deadline_2 = (
              datetime.now() + timedelta(days=14)
          ).replace(hour=23, minute=0, second=0, microsecond=0)

          for goal, deadline in [
              ("CI plan cũ", deadline_1),
              ("CI plan mới", deadline_2),
          ]:
              response = client.post(
                  "/study-plan/generate",
                  data={
                      "subject_id": str(test_subject_id),
                      "goal": goal,
                      "deadline": deadline.isoformat(timespec="minutes"),
                      "preferred_time": "19:00",
                      "daily_minutes": "45",
                  },
                  follow_redirects=False,
              )
              assert response.status_code in (302, 303)

          conn = project.db()
          open_reminders = conn.execute(
              """
              SELECT title,due_at
              FROM reminders
              WHERE user_id=? AND subject_id=? AND done=0
              ORDER BY id
              """,
              (user["id"], test_subject_id)
          ).fetchall()
          conn.close()

          assert len(open_reminders) == 1
          assert open_reminders[0]["title"] == "CI plan mới"
          assert open_reminders[0]["due_at"] == deadline_2.isoformat(
              timespec="minutes"
          )

          # =====================================================
          # PHASE 5: 2-user isolation + Web/Mobile shared-data integration
          # =====================================================
          conn = project.db()
          password_hash = project.generate_password_hash("ci-pass-123")

          user_a_id = conn.execute(
              """
              INSERT INTO users(name,email,password_hash,created_at)
              VALUES(?,?,?,?)
              """,
              ("CI User A", "ci-user-a@study.local", password_hash, project.now())
          ).lastrowid
          user_b_id = conn.execute(
              """
              INSERT INTO users(name,email,password_hash,created_at)
              VALUES(?,?,?,?)
              """,
              ("CI User B", "ci-user-b@study.local", password_hash, project.now())
          ).lastrowid

          subject_a_id = conn.execute(
              """
              INSERT INTO subjects(
                  user_id,name,code,description,credits,target_score,progress,created_at
              ) VALUES(?,?,?,?,?,?,?,?)
              """,
              (
                  user_a_id, "CI Shared Course", "CI-SHARED-001",
                  "A", 3, 8.0, 0, project.now()
              )
          ).lastrowid
          subject_b_id = conn.execute(
              """
              INSERT INTO subjects(
                  user_id,name,code,description,credits,target_score,progress,created_at
              ) VALUES(?,?,?,?,?,?,?,?)
              """,
              (
                  user_b_id, "CI Shared Course", "CI-SHARED-001",
                  "B", 3, 9.0, 0, project.now()
              )
          ).lastrowid
          conn.commit()

          shared_a = project.ensure_shared_subject_for_user_subject(
              conn, user_a_id, subject_a_id
          )
          shared_b = project.ensure_shared_subject_for_user_subject(
              conn, user_b_id, subject_b_id
          )
          assert shared_a["id"] == shared_b["id"]

          project.ensure_subject_chats(user_a_id, conn)
          project.ensure_subject_chats(user_b_id, conn)

          private_filename = "ci_private_user_a.txt"
          project.UPLOAD_DIR.mkdir(parents=True, exist_ok=True)
          (project.UPLOAD_DIR / private_filename).write_text(
              "PRIVATE A ONLY",
              encoding="utf-8"
          )
          conn.execute(
              """
              INSERT INTO documents(
                  user_id,subject_id,original_name,stored_name,extracted_text,created_at
              ) VALUES(?,?,?,?,?,?)
              """,
              (
                  user_a_id, subject_a_id, "private_a.txt", private_filename,
                  "Tài liệu riêng của user A", project.now()
              )
          )

          chat_a = conn.execute(
              """
              SELECT id FROM chat_conversations
              WHERE user_id=? AND subject_id=?
              """,
              (user_a_id, subject_a_id)
          ).fetchone()
          conn.execute(
              """
              INSERT INTO chat_messages(
                  user_id,conversation_id,role,content,created_at
              ) VALUES(?,?,?,?,?)
              """,
              (
                  user_a_id, chat_a["id"], "user",
                  "Tin nhắn riêng của A", project.now()
              )
          )

          quiz_payload = [{
              "question": "CI adaptive question?",
              "topic": "CI Topic",
              "chapter": "CI Chapter",
              "options": ["Đúng", "Sai 1", "Sai 2", "Sai 3"],
              "answer": 0
          }]
          quiz_a_id = conn.execute(
              """
              INSERT INTO quizzes(
                  user_id,subject_id,document_id,title,payload,created_at
              ) VALUES(?,?,?,?,?,?)
              """,
              (
                  user_a_id, subject_a_id, None, "CI Adaptive Quiz",
                  project.json.dumps(quiz_payload, ensure_ascii=False),
                  project.now()
              )
          ).lastrowid
          conn.commit()
          conn.close()

          client_a = project.app.test_client()
          client_b = project.app.test_client()

          for mobile_client, email in [
              (client_a, "ci-user-a@study.local"),
              (client_b, "ci-user-b@study.local"),
          ]:
              response = mobile_client.post(
                  "/api/mobile/login",
                  json={"email": email, "password": "ci-pass-123"}
              )
              assert response.status_code == 200

          # Đáp án Quiz phải được giữ trên server cho đến khi nộp bài.
          quiz_detail = client_a.get(
              f"/api/mobile/quizzes/{quiz_a_id}"
          )
          assert quiz_detail.status_code == 200
          public_question = quiz_detail.get_json()["questions"][0]
          assert "answer" not in public_question
          assert "explanation" not in public_question
          assert client_b.get(
              f"/api/mobile/quizzes/{quiz_a_id}"
          ).status_code == 404
          assert client_a.get("/quiz").status_code == 200
          assert b'data-answer=' not in client_a.get("/quiz").data

          # Cùng mã môn -> Shared Subject giống nhau, nhưng subject cá nhân khác nhau.
          subjects_a = client_a.get("/api/mobile/subjects").get_json()
          subjects_b = client_b.get("/api/mobile/subjects").get_json()
          assert any(item["id"] == subject_a_id for item in subjects_a)
          assert not any(item["id"] == subject_a_id for item in subjects_b)
          assert any(item["id"] == subject_b_id for item in subjects_b)

          # User B không đọc được subject, file hay chat của User A.
          assert client_b.get(
              f"/api/mobile/subjects/{subject_a_id}"
          ).status_code == 404
          assert client_b.get(
              f"/uploads/{private_filename}"
          ).status_code == 404
          assert client_a.get(
              f"/uploads/{private_filename}"
          ).status_code == 200
          assert client_b.get(
              f"/api/mobile/chat/{subject_a_id}"
          ).status_code == 404

          history_a = client_a.get(
              f"/api/mobile/chat/{subject_a_id}"
          )
          assert history_a.status_code == 200
          assert any(
              item["content"] == "Tin nhắn riêng của A"
              for item in history_a.get_json()["messages"]
          )

          # Web tạo task -> Mobile nhìn thấy cùng task -> Web toggle -> Mobile thấy done.
          create_task = client_a.post(
              "/study-plan/tasks/create",
              data={
                  "subject_id": str(subject_a_id),
                  "title": "CI Web to Mobile task",
                  "study_at": (
                      datetime.now() + timedelta(days=1)
                  ).replace(
                      hour=18, minute=0, second=0, microsecond=0
                  ).isoformat(timespec="minutes"),
                  "duration": "45",
                  "note": "sync"
              },
              follow_redirects=False
          )
          assert create_task.status_code in (302, 303)

          mobile_plan = client_a.get(
              "/api/mobile/study-plan"
          ).get_json()
          synced_task = next(
              item for item in mobile_plan["tasks"]
              if item["title"] == "CI Web to Mobile task"
          )

          toggle = client_a.post(
              f"/study-plan/tasks/{synced_task['id']}/toggle",
              follow_redirects=False
          )
          assert toggle.status_code in (302, 303)
          mobile_plan_after = client_a.get(
              "/api/mobile/study-plan"
          ).get_json()
          toggled_task = next(
              item for item in mobile_plan_after["tasks"]
              if item["id"] == synced_task["id"]
          )
          assert toggled_task["done"] == 1

          # Mobile Quiz sai -> weakness + adaptive task; làm đúng -> resolve + gỡ task.
          wrong_result = client_a.post(
              "/api/mobile/quiz/submit",
              json={"quiz_id": quiz_a_id, "answers": [1]}
          )
          assert wrong_result.status_code == 200
          wrong_data = wrong_result.get_json()
          assert wrong_data["correct_answers"] == [0]
          assert wrong_data["weakness_count"] == 1
          assert wrong_data["adaptive_task"] is not None

          mobile_subjects_after_wrong = client_a.get(
              "/api/mobile/subjects"
          ).get_json()
          a_after_wrong = next(
              item for item in mobile_subjects_after_wrong
              if item["id"] == subject_a_id
          )
          assert len(a_after_wrong["weaknesses"]) == 1

          correct_result = client_a.post(
              "/api/mobile/quiz/submit",
              json={"quiz_id": quiz_a_id, "answers": [0]}
          )
          assert correct_result.status_code == 200
          correct_data = correct_result.get_json()
          assert correct_data["correct_answers"] == [0]
          assert correct_data["weakness_count"] == 0
          assert "CI Topic" in correct_data["resolved_topics"]

          conn = project.db()
          open_adaptive = conn.execute(
              """
              SELECT COUNT(*) AS c
              FROM study_tasks
              WHERE user_id=? AND subject_id=?
                AND source='adaptive' AND done=0
              """,
              (user_a_id, subject_a_id)
          ).fetchone()["c"]
          conn.close()
          assert int(open_adaptive or 0) == 0

          # Mobile tạo lại Study Plan cũng phải thay deadline giống Web.
          mobile_deadline_1 = (
              datetime.now() + timedelta(days=10)
          ).replace(hour=21, minute=0, second=0, microsecond=0)
          mobile_deadline_2 = (
              datetime.now() + timedelta(days=16)
          ).replace(hour=21, minute=0, second=0, microsecond=0)

          for goal, deadline in [
              ("Mobile plan cũ", mobile_deadline_1),
              ("Mobile plan mới", mobile_deadline_2),
          ]:
              response = client_a.post(
                  "/api/mobile/study-plan",
                  json={
                      "subject_id": subject_a_id,
                      "goal": goal,
                      "deadline": deadline.isoformat(timespec="minutes"),
                      "preferred_time": "19:00",
                      "daily_minutes": 45,
                  }
              )
              assert response.status_code == 200

          conn = project.db()
          mobile_reminders = conn.execute(
              """
              SELECT title,due_at
              FROM reminders
              WHERE user_id=? AND subject_id=? AND done=0
              ORDER BY id
              """,
              (user_a_id, subject_a_id)
          ).fetchall()
          conn.close()
          assert len(mobile_reminders) == 1
          assert mobile_reminders[0]["title"] == "Mobile plan mới"
          assert mobile_reminders[0]["due_at"] == mobile_deadline_2.isoformat(
              timespec="minutes"
          )

          (project.UPLOAD_DIR / private_filename).unlink(missing_ok=True)

          # Mobile Stage 1: CRUD môn, tài liệu riêng và personal syllabus.
          from io import BytesIO
          response = client_a.post(
              "/api/mobile/subjects",
              json={
                  "name": "CI Mobile CRUD",
                  "code": "CI-MOBILE-001",
                  "credits": 3,
                  "target_score": 8.0,
                  "description": "Test tạo môn trên iPhone",
              }
          )
          assert response.status_code == 201, response.get_data(as_text=True)
          managed_id = response.get_json()["subject"]["id"]
          assert client_b.put(
              f"/api/mobile/subjects/{managed_id}",
              json={"name": "Không được sửa"}
          ).status_code == 404

          update_result = client_a.put(
              f"/api/mobile/subjects/{managed_id}",
              json={
                  "name": "CI Mobile Edited",
                  "code": "CI-MOBILE-001",
                  "credits": 4,
                  "target_score": 9,
                  "description": "Đã chỉnh",
              }
          )
          assert update_result.status_code == 200
          assert update_result.get_json()["subject"]["credits"] == 4

          upload_result = client_a.post(
              "/api/mobile/documents",
              data={
                  "subject_id": str(managed_id),
                  "file": (BytesIO(b"CI mobile sample syllabus"), "ci-mobile.txt"),
              },
              content_type="multipart/form-data"
          )
          assert upload_result.status_code == 201, upload_result.get_data(as_text=True)
          managed_doc_id = upload_result.get_json()["document"]["id"]
          assert client_b.delete(
              f"/api/mobile/documents/{managed_doc_id}"
          ).status_code == 404
          assert client_b.get(
              f"/api/mobile/documents/{managed_doc_id}"
          ).status_code == 404
          preview = client_a.get(
              f"/api/mobile/documents/{managed_doc_id}"
          )
          assert preview.status_code == 200
          assert "CI mobile sample syllabus" in preview.get_json()["document"]["extracted_text"]

          # Tóm tắt có thể test bằng AI mock, không cần API key/chi phí.
          project.gemini_generate = lambda prompt, **kwargs: ("CI tóm tắt đúng nội dung", "")
          summary = client_a.post(
              f"/api/mobile/documents/{managed_doc_id}/summary"
          )
          assert summary.status_code == 200
          assert summary.get_json()["used_ai"] is True
          assert "CI tóm tắt" in summary.get_json()["summary"]
          assert client_b.post(
              f"/api/mobile/documents/{managed_doc_id}/summary"
          ).status_code == 404

          syllabus_response = client_a.put(
              f"/api/mobile/subjects/{managed_id}/personal-syllabus",
              json={"document_id": managed_doc_id}
          )
          assert syllabus_response.status_code == 200
          detail_response = client_a.get(
              f"/api/mobile/subjects/{managed_id}"
          )
          assert detail_response.status_code == 200
          assert detail_response.get_json()["subject"]["personal_syllabus_document_id"] == managed_doc_id
          assert detail_response.get_json()["shared"]["syllabus_source"] == "personal"

          # Other user's document cannot be selected as syllabus.
          assert client_b.put(
              f"/api/mobile/subjects/{subject_b_id}/personal-syllabus",
              json={"document_id": managed_doc_id}
          ).status_code == 400

          delete_doc_result = client_a.delete(
              f"/api/mobile/documents/{managed_doc_id}"
          )
          assert delete_doc_result.status_code == 200
          assert client_a.get(
              f"/api/mobile/subjects/{managed_id}"
          ).get_json()["subject"]["personal_syllabus_document_id"] is None
          assert client_a.delete(
              f"/api/mobile/subjects/{managed_id}"
          ).status_code == 200
          assert client_a.get(
              f"/api/mobile/subjects/{managed_id}"
          ).status_code == 404
          print("Mobile Stage 1 CRUD and private document tests OK")

          # Mobile Stage 2–4: planner, deadlines, quizzes, profile,
          # registration, dashboard recommendations and access control.
          task_at = (datetime.now() + timedelta(days=3)).replace(
              hour=20, minute=0, second=0, microsecond=0
          ).isoformat(timespec="minutes")
          created = client_a.post(
              "/api/mobile/tasks",
              json={
                  "subject_id": subject_a_id,
                  "title": "Mobile tạo buổi học",
                  "study_at": task_at,
                  "duration": 45,
                  "note": "mobile CRUD"
              }
          )
          assert created.status_code == 201, created.get_data(as_text=True)
          stage_task = created.get_json()["task"]["id"]
          assert client_b.post(
              f"/api/mobile/tasks/{stage_task}/toggle"
          ).status_code == 404
          assert client_b.delete(
              f"/api/mobile/tasks/{stage_task}"
          ).status_code == 404
          assert client_a.put(
              f"/api/mobile/tasks/{stage_task}",
              json={
                  "subject_id": subject_a_id, "title": "Đã chỉnh từ Mobile",
                  "study_at": task_at, "duration": 60, "note": "edited"
              }
          ).status_code == 200
          assert client_a.post(
              f"/api/mobile/tasks/{stage_task}/toggle"
          ).get_json()["done"] == 1
          assert client_a.delete(
              f"/api/mobile/tasks/{stage_task}"
          ).status_code == 200

          reminder_created = client_a.post(
              "/api/mobile/reminders",
              json={
                  "subject_id": subject_a_id, "title": "CI mobile reminder",
                  "due_at": task_at
              }
          )
          assert reminder_created.status_code == 201
          reminder_id = reminder_created.get_json()["reminder"]["id"]
          assert client_b.delete(
              f"/api/mobile/reminders/{reminder_id}"
          ).status_code == 404
          reminder_update = client_a.put(
              f"/api/mobile/reminders/{reminder_id}",
              json={
                  "subject_id": subject_a_id,
                  "title": "CI deadline updated", "due_at": task_at, "done": True
              }
          )
          assert reminder_update.status_code == 200
          assert reminder_update.get_json()["reminder"]["done"] == 1
          assert client_a.delete(
              f"/api/mobile/reminders/{reminder_id}"
          ).status_code == 200

          quizzes = client_a.get("/api/mobile/quizzes").get_json()["quizzes"]
          assert any(q["id"] == quiz_a_id and q["attempt_count"] == 2 for q in quizzes)
          assert not any(
              q["id"] == quiz_a_id
              for q in client_b.get("/api/mobile/quizzes").get_json()["quizzes"]
          )
          assert client_b.get(
              f"/api/mobile/quizzes/{quiz_a_id}"
          ).status_code == 404
          quiz_details = client_a.get(
              f"/api/mobile/quizzes/{quiz_a_id}"
          ).get_json()
          assert len(quiz_details["attempts"]) == 2
          assert len(quiz_details["questions"]) == 1

          assert client_a.put(
              "/api/mobile/profile",
              json={
                  "learning_style": "visual",
                  "preferred_study_time": "20:15",
                  "daily_minutes": 60,
                  "goals": "CI mobile learning goals",
                  "notes": "A only"
              }
          ).status_code == 200
          assert client_a.get(
              "/api/mobile/profile"
          ).get_json()["profile"]["goals"] == "CI mobile learning goals"
          assert client_b.get(
              "/api/mobile/profile"
          ).get_json()["profile"]["goals"] != "CI mobile learning goals"
          assert client_a.put(
              "/api/mobile/profile",
              json={"preferred_study_time": "99:99"}
          ).status_code == 400

          dashboard_a = client_a.get("/api/mobile/dashboard")
          assert dashboard_a.status_code == 200
          assert "next_best_action" in dashboard_a.get_json()
          assert dashboard_a.get_json()["stats"]["quiz_attempt_count"] >= 2

          fresh_client = project.app.test_client()
          fresh_registration = fresh_client.post(
              "/api/mobile/register",
              json={
                  "name": "CI New Mobile User",
                  "email": "ci-new-mobile@study.local",
                  "password": "test-pass-123"
              }
          )
          assert fresh_registration.status_code == 201
          assert fresh_client.get(
              "/api/mobile/subjects"
          ).get_json() == []
          assert client_b.post(
              "/api/mobile/register",
              json={
                  "name": "Duplicate", "email": "ci-new-mobile@study.local",
                  "password": "123456"
              }
          ).status_code == 409

          print("Mobile Stages 2–4 business flows and account isolation OK")

          print("Core web smoke OK:", ", ".join(paths))
          print("Business flow checks OK: syllabus fallback, deadline replace")
          print("Phase 5 checks OK: 2-user isolation, Web/Mobile sync, adaptive loop")
