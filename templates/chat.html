{% extends "base.html" %}
{% block page_title %}Chat AI{% endblock %}
{% block page_desc %}Trợ lý học tập AI theo từng môn{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">{% endblock %}

{% block content %}
<section class="chat-shell-new">
  <section class="soft-card chat-main-panel">
    <header class="chat-header">
      <div class="chat-ai-info">
        <div class="chat-ai-avatar"><img src="{{ url_for('static', filename='images/ai-robot.svg') }}" alt=""></div>
        <div><strong id="chatSubjectName">AI Study Agent</strong><span id="chatContextStatus"><i></i>Chọn một môn học để bắt đầu</span></div>
      </div>
      <a class="chat-documents-link" href="{{ url_for('documents') }}">▤ Tài liệu</a>
    </header>

    <div class="chat-mobile-subject">
      <label for="chatMobileSubject">Môn học</label>
      <select id="chatMobileSubject" aria-label="Chuyển môn học trong Chat AI"></select>
    </div>

    <section class="chat-mode-panel" aria-label="Chọn chế độ Chat AI">
      <div class="chat-mode-switch" role="group" aria-label="Chế độ trợ lý">
        <button id="chatModeFree" type="button" class="active" aria-pressed="true">💬 Hỏi đáp tự do</button>
        <button id="chatModeChapter" type="button" aria-pressed="false">📖 Học theo chương</button>
      </div>
      <div id="chatLessonSummary" class="chat-lesson-summary" hidden>
        <span class="chat-lesson-summary-text">
          <strong id="chatLessonSummaryTitle"></strong>
          <small id="chatLessonSummarySource"></small>
        </span>
        <button id="chatChangeChapter" class="chat-change-chapter" type="button" aria-controls="chatChapterControls" aria-expanded="false">Đổi nội dung</button>
      </div>
      <div id="chatChapterControls" class="chat-chapter-controls" hidden>
        <label> Môn học
          <select id="chatCourseSelect" aria-label="Môn học trong chế độ học theo chương"></select>
        </label>
        <label> Chương
          <select id="chatChapterSelect" aria-label="Chọn chương học"></select>
        </label>
        <label> Tiểu mục
          <select id="chatTopicSelect" aria-label="Chọn tiểu mục học"></select>
        </label>
      </div>
      <div id="chatModeNotice" class="chat-mode-notice" aria-live="polite" hidden></div>
      <div id="lessonModeBanner" class="chat-lesson-source" role="status" aria-live="polite" hidden>
        <strong id="lessonModeTitle"></strong>
        <span id="lessonModeSources"></span>
      </div>
    </section>
    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-suggest-row">
      <a href="{{ url_for('documents') }}">↑ Tải tài liệu lên</a>
      <button type="button" data-chat-prompt="Tóm tắt nội dung chính giúp mình.">▤ Tóm tắt nội dung</button>
      <button type="button" data-chat-prompt="Tạo quiz từ nội dung đang học.">? Tạo quiz</button>
      <button type="button" data-chat-prompt="Giải thích thêm phần này bằng ví dụ.">💡 Giải thích thêm</button>
    </div>

    <div class="chat-composer">
      <div class="composer-inner">
        <a href="{{ url_for('documents') }}" class="composer-action" title="Tải tài liệu">⌕</a>
        <textarea id="chatInput" rows="1" placeholder="Nhập tin nhắn của bạn..."></textarea>
        <button class="chat-send-button" id="chatSendButton" type="button" title="Gửi">➤</button>
      </div>
    </div>
  </section>
</section>

<script src="{{ url_for('static', filename='js/chat_format.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
